# Viessmann Vitola 111 / Vitotronic 200 Typ KW2 (Geraetekennung 0x2098) per Optolink
# Hardware: ESP32-WROOM-32U DevKitC V4 (externe Antenne) + DIY-Lesekopf am „V“ der Regelung
#   3,3 V ── 220 Ω ── IR-LED (Anode) │ Kathode ── GPIO17 (TX)    [Chanzon 940 nm, 3 mm]
#   3,3 V ── 10 kΩ ──┬── GPIO16 (RX)                              [Osram SFH 309, Kollektor = kurzes Bein]
#                    └── Kollektor Fototransistor │ Emitter ── GND
#   DS18B20 „Zirkulation Rücklauf“ (13.10.): rot 3,3 V · schwarz GND · gelb GPIO4, 4,7 kΩ gelb↔rot am Kabelende
#   Schaltung nach VitoWiFi/openv-Wiki („Die Optolink-Schnittstelle“, „ESPHome-Optolink“).
# Komponente: ESPHome-PR #4453 (j0ta29, Stand 17.09.2026), Protokoll KW (VS1), 4800 8E2.
# Adressen: openv-Wiki „Adressen“, Spalte V200KW2/KW1.
# Bis 22.10.2026 bewusst NUR LESEND. Seit Variante „raumsoll-schreiben“ (22.10.) GENAU EIN
#   schreibender Datenpunkt: number „Raumsoll HK2 einstellen“ (0x3306, 18–28 °C, ganze Grad).
#   KW-Protokoll hat KEINE Pruefsumme → nach jedem Schreiben Rueckmeldung ueber den
#   Lese-Sensor „Raumsoll HK2“ pruefen (HA-Skript heizung_raumsoll_hk2_setzen).
#   Rueckweg: heizung-optolink.yaml.vor-raumsoll-schreiben-20261022
# Stand 04.10.2026, Notiz project_oeltank_fuellstandsensor.

substitutions:
  name: heizung-optolink
  friendly_name: Heizung

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  comment: Vitotronic 200 KW2 per Optolink (lesend + Raumsoll HK2)

esp32:
  board: esp32dev
  framework:
    type: arduino   # Optolink-Komponente laeuft nur mit Arduino

external_components:
  - source: github://pr#4453
    components: [optolink]

logger:
  level: INFO       # 14.10. nach Debug-Mitschnitt zurueck auf INFO; UART0 bleibt frei fuer USB-Log

api:
  encryption:
    key: !secret heizung_api_key

ota:
  - platform: esphome   # Updates per WLAN, abgesichert ueber den API-Schluessel

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: Heizung-Fallback
    password: !secret heizung_ap_password

captive_portal:

debug:
  update_interval: 3600s   # 12.10.: nur fuer den Neustart-Grund

optolink:
  protocol: KW
  rx_pin: GPIO16
  tx_pin: GPIO17
  logger: false     # 14.10.: Rohbytes wieder aus (Debug-Mitschnitt abgeschlossen)

text_sensor:
  - platform: debug
    reset_reason:
      name: Neustart-Grund         # 12.10.: ESP32 meldet Unterspannung als „Brownout“ → Netzteil-Verdacht pruefbar
      entity_category: diagnostic
  - platform: optolink
    type: DEVICE_INFO
    name: Gerätekennung
    entity_category: diagnostic
    update_interval: 1800s
  - platform: optolink
    type: STATE_INFO
    name: Optolink-Status
    entity_category: diagnostic
    update_interval: 30s

binary_sensor:
  # 14.10.: FEHLMELDUNGEN GEKLAERT (Debug-Mitschnitt 17:34–18:24): Nach jeder Bus-Unterbrechung („communication disrupted –
  #   suspending 20000 ms“, ~1×/min) liefert die ERSTE Anfrage nach „resuming communication“ das Sync-Byte 0x05 der Vitotronic
  #   als Antwort (21 von 21 Faellen). Bei 1-Byte-Datenpunkten wird 0x05 als „an“ gelesen → Sammel-/Brennerstoerung, Brenner.
  #   Abhilfe ohne Eingriff in die Komponente: Rohwert als 1-Byte-Sensor lesen, NUR 0 oder 1 uebernehmen, alles andere verwerfen
  #   (letzter gueltiger Zustand bleibt). Entitaeten/Namen unveraendert. Rueckweg: heizung-optolink.yaml.vor-debug-20261014
  - platform: template
    id: bs_brennerstoerung
    name: Brennerstörung            # = Anzeige D1
    device_class: problem
  - platform: template
    id: bs_sammelstoerung
    name: Sammelstörung
    device_class: problem
    filters:
      # 13.10.: meldete ~20x kurz „an“ (14.10. erklaert: Sync-Byte 0x05, jetzt oben verworfen); Verzoegerung bleibt als Reserve.
      - delayed_on: 30min
  - platform: template
    id: bs_brenner
    name: Brenner                   # Zustand 1. Stufe (0x0842)
    device_class: running
  - platform: template
    id: bs_speicherladepumpe
    name: Speicherladepumpe
    device_class: running
  - platform: template
    id: bs_zirkulationspumpe
    name: Zirkulationspumpe
    device_class: running
  - platform: template
    id: bs_heizkreispumpe
    name: Heizkreispumpe            # A1 (ohne Mischer)
    device_class: running
  - platform: template
    id: bs_heizkreispumpe_m2
    name: Heizkreispumpe M2
    device_class: running

one_wire:
  - platform: gpio
    pin: GPIO4               # 13.10.: DS18B20 Zirkulation, Pull-up 4,7 kΩ am Kabel

sensor:
  # --- Rohwerte der Schaltzustaende (14.10.): nur 0/1 gilt, 0x05 = Sync-Byte nach Bus-Unterbrechung → verwerfen ---
  - platform: optolink
    id: roh_brennerstoerung
    internal: true
    address: 0x0883
    bytes: 1
    accuracy_decimals: 0
    update_interval: 120s
    on_value:
      - lambda: |-
          if (x == 0.0f || x == 1.0f) id(bs_brennerstoerung).publish_state(x == 1.0f);
          else ESP_LOGW("optolink_filter", "0x0883: Rohwert %.0f verworfen (Sync-Byte?)", x);
  - platform: optolink
    id: roh_sammelstoerung
    internal: true
    address: 0x0847
    bytes: 1
    accuracy_decimals: 0
    update_interval: 120s
    on_value:
      - lambda: |-
          if (x == 0.0f || x == 1.0f) id(bs_sammelstoerung).publish_state(x == 1.0f);
          else ESP_LOGW("optolink_filter", "0x0847: Rohwert %.0f verworfen (Sync-Byte?)", x);
  - platform: optolink
    id: roh_brenner
    internal: true
    address: 0x0842
    bytes: 1
    accuracy_decimals: 0
    update_interval: 30s
    on_value:
      - lambda: |-
          if (x == 0.0f || x == 1.0f) id(bs_brenner).publish_state(x == 1.0f);
          else ESP_LOGW("optolink_filter", "0x0842: Rohwert %.0f verworfen (Sync-Byte?)", x);
  - platform: optolink
    id: roh_speicherladepumpe
    internal: true
    address: 0x0845
    bytes: 1
    accuracy_decimals: 0
    update_interval: 120s
    on_value:
      - lambda: |-
          if (x == 0.0f || x == 1.0f) id(bs_speicherladepumpe).publish_state(x == 1.0f);
          else ESP_LOGW("optolink_filter", "0x0845: Rohwert %.0f verworfen (Sync-Byte?)", x);
  - platform: optolink
    id: roh_zirkulationspumpe
    internal: true
    address: 0x0846
    bytes: 1
    accuracy_decimals: 0
    update_interval: 120s
    on_value:
      - lambda: |-
          if (x == 0.0f || x == 1.0f) id(bs_zirkulationspumpe).publish_state(x == 1.0f);
          else ESP_LOGW("optolink_filter", "0x0846: Rohwert %.0f verworfen (Sync-Byte?)", x);
  - platform: optolink
    id: roh_heizkreispumpe
    internal: true
    address: 0x2906
    bytes: 1
    accuracy_decimals: 0
    update_interval: 1800s
    on_value:
      - lambda: |-
          if (x == 0.0f || x == 1.0f) id(bs_heizkreispumpe).publish_state(x == 1.0f);
          else ESP_LOGW("optolink_filter", "0x2906: Rohwert %.0f verworfen (Sync-Byte?)", x);
  - platform: optolink
    id: roh_heizkreispumpe_m2
    internal: true
    address: 0x3906
    bytes: 1
    accuracy_decimals: 0
    update_interval: 120s
    on_value:
      - lambda: |-
          if (x == 0.0f || x == 1.0f) id(bs_heizkreispumpe_m2).publish_state(x == 1.0f);
          else ESP_LOGW("optolink_filter", "0x3906: Rohwert %.0f verworfen (Sync-Byte?)", x);

  # --- Temperaturen ---
  - platform: dallas_temp
    name: Zirkulation Rücklauf
    update_interval: 60s
  - platform: optolink
    name: Außentemperatur
    address: 0x0800
    bytes: 2
    div_ratio: 10
    min_value: -60                  # negativ → Wert wird vorzeichenbehaftet gelesen
    unit_of_measurement: °C
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 120s
  - platform: optolink
    name: Außentemperatur gedämpft
    address: 0x5527
    bytes: 2
    div_ratio: 10
    min_value: -60
    unit_of_measurement: °C
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 600s
  - platform: optolink
    name: Kesseltemperatur
    address: 0x0802
    bytes: 2
    div_ratio: 10
    unit_of_measurement: °C
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 60s
  - platform: optolink
    name: Kesselsolltemperatur
    address: 0x5502                 # 11.10.: 0x555A liefert FF FF (nur Vitodens 20CB); 0x5502 = 79,4 °C
    bytes: 2
    div_ratio: 10
    unit_of_measurement: °C
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 300s  # 12.10. Busentlastung (vorher 120s)
  - platform: optolink
    name: Warmwassertemperatur
    address: 0x0804                 # Speicher (Sensor 5)
    bytes: 2
    div_ratio: 10
    unit_of_measurement: °C
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 120s
  - platform: optolink
    name: Vorlauftemperatur
    address: 0x080C                 # Sensor 17B
    bytes: 2
    div_ratio: 10
    unit_of_measurement: °C
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 120s
  # Vorlaufsolltemperatur entfernt 11.10.: 0x2544 (A1) und 0x3544 (M2) liefern an dieser KW2 FF FF
  - platform: optolink
    name: Warmwasser-Solltemperatur
    address: 0x6300                 # 11.10. gelesen: 55
    bytes: 1
    unit_of_measurement: °C
    device_class: temperature
    accuracy_decimals: 0
    update_interval: 600s
    filters:
      # 12.10.: erster Wert nach Neustart war 5 statt 55 → Unplausibles verwerfen (letzter gueltiger Wert bleibt stehen).
      # Achtung: ein bewusst unter 30 °C gestelltes Soll wuerde damit ebenfalls verschluckt.
      - lambda: |-
          if (x < 30.0f || x > 95.0f) return {};
          return x;
  - platform: optolink
    name: Abgastemperatur           # nur sinnvoll, wenn ein Abgasfuehler verbaut ist
    address: 0x0808
    bytes: 2
    div_ratio: 10
    unit_of_measurement: °C
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    entity_category: diagnostic
    update_interval: 1800s  # 12.10. Busentlastung (vorher 300s)

  # --- Zaehler fuer Verbrauch und Tankprognose ---
  - platform: optolink
    name: Brennerstarts
    address: 0x088A
    bytes: 4
    state_class: total_increasing
    accuracy_decimals: 0
    icon: mdi:fire
    update_interval: 60s  # 12.10. minutengenau fuer Startverzoegerung + Oelverbrauch (vorher 600s)
  - platform: optolink
    name: Brennerstunden
    address: 0x08A7                 # Stufe 1, in Sekunden
    bytes: 4
    div_ratio: 3600
    unit_of_measurement: h
    device_class: duration
    state_class: total_increasing
    accuracy_decimals: 2
    update_interval: 60s  # 12.10. minutengenau fuer Startverzoegerung + Oelverbrauch (vorher 600s)
  - platform: optolink
    name: Ölverbrauch Regelung      # Bedeutung bei dieser Anlage unklar → erst beobachten
    address: 0x7574
    bytes: 4
    div_ratio: 1000
    entity_category: diagnostic
    accuracy_decimals: 3
    update_interval: 1800s

  # --- Einstellungen (nur anzeigen) ---
  - platform: optolink
    name: Heizkurve Neigung
    address: 0x3305                 # 22.10.: M2 (belegter Kreis); bis dahin 0x2305 = HK1 „Ohne Funktion“ (11.10. beide 1,4)
    bytes: 1
    div_ratio: 10
    accuracy_decimals: 1
    entity_category: diagnostic
    update_interval: 1800s
    filters:
      - lambda: |-   # 19.10.: Rohbyte 0x05 (= 0,5) ist das Sync-Byte nach Bus-Unterbrechung (15.–18.10. 20x neben 1,4); echte Neigung 0,5 wuerde mitverworfen
          if (x > 0.45f && x < 0.55f) return {};
          return x;
  - platform: optolink
    name: Heizkurve Niveau
    address: 0x3304                 # 22.10.: M2; bis dahin 0x2304 = HK1 (11.10. beide 0)
    bytes: 1
    min_value: -13                  # vorzeichenbehaftet
    unit_of_measurement: K
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: 1800s
  - platform: optolink
    name: Betriebsart (Rohwert)
    address: 0x3301                 # 22.10.: M2; bis dahin 0x2301 = HK1
    bytes: 1
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 600s
    filters:
      - lambda: |-   # 14.10.: gueltig 0–4; 5 = Sync-Byte nach Bus-Unterbrechung (14.10. 18:04 gesehen)
          if (x > 4.0f) return {};
          return x;
  - platform: optolink
    name: Raumtemperatur Soll
    address: 0x2306
    bytes: 1
    unit_of_measurement: °C
    device_class: temperature
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: 600s
    filters:
      - lambda: |-   # 14.10.: Sync-Byte 0x05 nach Bus-Unterbrechung verwerfen
          if (x < 10.0f || x > 30.0f) return {};
          return x;
  - platform: optolink
    name: Raumsoll HK2              # 22.10.: Mischerkreis M2 = einziger belegter Heizkreis (HK1 „Ohne Funktion“)
    id: raumsoll_hk2
    address: 0x3306                 # 11.10. gelesen 37, 17.10. am Display 37 → 25 bestaetigt
    bytes: 1
    unit_of_measurement: °C
    device_class: temperature
    accuracy_decimals: 0
    update_interval: 300s
    filters:
      - lambda: |-   # Bereich der KW2 3–37 °C; 5 = Sync-Byte nach Bus-Unterbrechung (wie 0x2305/0x2301)
          if (x < 3.0f || x > 37.0f || x == 5.0f) return {};
          return x;

  # --- ESP selbst ---
  - platform: optolink
    type: QUEUE_SIZE
    name: Optolink-Warteschlange
    entity_category: diagnostic
    update_interval: 60s
  - platform: wifi_signal
    name: WLAN-Signal
    update_interval: 120s
  - platform: uptime
    name: Laufzeit
    update_interval: 600s

number:
  # 22.10.2026: einziger SCHREIBENDER Datenpunkt. Bereich bewusst eng (18–28): ein Tippfehler
  # oder ein verrutschter Regler kann den Kessel weder auskuehlen noch auf 37 °C treiben.
  # Die Komponente liest den Wert auch selbst zurueck (ohne Filter — Sync-Byte 5 kann kurz
  # angezeigt werden); massgeblich fuer die Rueckmeldung ist der Sensor „Raumsoll HK2“.
  - platform: optolink
    name: Raumsoll HK2 einstellen
    address: 0x3306
    bytes: 1
    min_value: 18
    max_value: 28
    step: 1
    mode: box
    unit_of_measurement: °C
    icon: mdi:thermostat
    update_interval: 1800s
